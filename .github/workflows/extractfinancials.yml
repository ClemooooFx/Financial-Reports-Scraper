name: Extract Financial Statements

on:
  # Run after scraper completes or manually
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Batch number to process (leave empty for all)'
        required: false
        default: ''
      force_reprocess:
        description: 'Force reprocess already processed files'
        required: false
        type: boolean
        default: false
  
  # Or run on schedule (weekly on Sundays at 3 AM UTC)
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check if extraction needed
        id: check
        run: |
          # Count unprocessed PDFs
          unprocessed=$(find reports -name "*.pdf" ! -name "*-balance-sheet.json" -o ! -name "*-income-statement.json" | wc -l)
          if [ "${{ github.event.inputs.force_reprocess }}" == "true" ] || [ $unprocessed -gt 0 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No unprocessed PDFs found"
          fi

  extract:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af
          echo "After cleanup:"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber pandas
      
      - name: Run extraction
        run: |
          if [ -n "${{ github.event.inputs.batch_number }}" ]; then
            python extract_financials.py --batch ${{ github.event.inputs.batch_number }} --batch-size 10 ${{ github.event.inputs.force_reprocess == 'true' && '--force' || '' }}
          else
            python extract_financials.py --batch-size 10 ${{ github.event.inputs.force_reprocess == 'true' && '--force' || '' }}
          fi
        timeout-minutes: 120
      
      - name: Monitor disk space
        if: always()
        run: |
          echo "Final disk space:"
          df -h
          echo "Reports directory size:"
          du -sh reports/ || echo "No reports directory"
      
      - name: Check for changes
        id: check_changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No new extracted files"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Found new extracted files"
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "Extract financial statements - $(date +'%Y-%m-%d')"
          git push
      
      - name: Create summary
        if: always()
        run: |
          echo "## Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "reports/extraction_summary.json" ]; then
            echo "**Results:**" >> $GITHUB_STEP_SUMMARY
            python3 << EOF >> $GITHUB_STEP_SUMMARY
import json
with open('reports/extraction_summary.json') as f:
    data = json.load(f)
print(f"- Total PDFs: {data['total_pdfs']}")
print(f"- Successful: {data['successful']}")
print(f"- Skipped: {data['skipped']}")
print(f"- Failed: {data['failed']}")
print()
print("**Statements Extracted:**")
for stmt, count in data['statements_extracted'].items():
    print(f"- {stmt}: {count}")
EOF
          fi
      
      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-summary-${{ github.run_number }}
          path: reports/extraction_summary*.json
          retention-days: 30
