name: Extract Financial Statements

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "PDFs per batch"
        required: false
        default: "20"
      force_reprocess:
        description: "Force reprocess already processed files"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 3 15 1,4,7,10 *'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set-batches.outputs.batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Count PDFs and create batch matrix dynamically
        id: set-batches
        run: |
          BATCH_SIZE=${{ github.event.inputs.batch_size }}
          if [ -z "$BATCH_SIZE" ] || [ "$BATCH_SIZE" == "0" ]; then
              BATCH_SIZE=20
          fi

          PDF_COUNT=$(find reports -type f -name "*.pdf" | wc -l)
          echo "Total PDFs: $PDF_COUNT"
          echo "Batch size: $BATCH_SIZE"

          TOTAL_BATCHES=$(( (PDF_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))

          # Build JSON array [1,2,3,...]
          BATCH_LIST=$(seq -s "," 1 $TOTAL_BATCHES)
          echo "batches=[$BATCH_LIST]" >> $GITHUB_OUTPUT

  extract:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches) }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pdfplumber pandas

      - name: Run extractor for batch ${{ matrix.batch }}
        run: |
          python extract_financials.py \
            --batch ${{ matrix.batch }} \
            --batch-size ${{ github.event.inputs.batch_size }} \
            ${{ github.event.inputs.force_reprocess == 'true' && '--force' || '' }}

      - name: Git commit & push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add reports/

          if ! git diff --cached --quiet; then
              git commit -m "Extracted financial statements – batch ${{ matrix.batch }}"
              git pull --rebase origin main || true
              git push
          else
              echo "No new files to commit."
          fi

      - name: Upload batch summary
        uses: actions/upload-artifact@v4
        with:
          name: extraction-summary-batch-${{ matrix.batch }}
          path: reports/extraction_summary_batch_${{ matrix.batch }}.json
          retention-days: 30
