name: NSE Financial Reports Scraper
on:
  # Run mid-quarter: Feb 15, May 15, Aug 15, Nov 15 at 2 AM UTC
  schedule:
    - cron: '0 2 15 2,5,8,11 *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Batch number to process (1-7, or 0 for all batches)'
        required: false
        default: '0'
        
permissions:
  contents: write
  
jobs:
  # First job: determine which batches to run
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set-batches.outputs.batches }}
    steps:
      - name: Set batch matrix
        id: set-batches
        run: |
          if [ "${{ github.event.inputs.batch_number }}" == "0" ] || [ -z "${{ github.event.inputs.batch_number }}" ]; then
            echo "batches=[1,2,3,4,5,6,7]" >> $GITHUB_OUTPUT
          else
            echo "batches=[${{ github.event.inputs.batch_number }}]" >> $GITHUB_OUTPUT
          fi
  
  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # Process one batch at a time
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches) }}
    
    steps:
    - name: Free Disk Space
      run: |
        echo "Before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        echo "After cleanup:"
        df -h
        
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Tor
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y tor
        sudo service tor start
        sleep 5
        echo "✓ Tor service started"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install urllib3[socks]
    
    - name: Verify Tor connection
      run: |
        TOR_IP=$(curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -o '"IP":"[^"]*"' | cut -d'"' -f4)
        echo "✓ Connected through Tor exit node: $TOR_IP"
        
    - name: Create reports directory
      run: mkdir -p reports
      
    - name: Run scraper for batch ${{ matrix.batch }}
      run: |
        python scraper.py --batch ${{ matrix.batch }} --batch-size 10
      continue-on-error: true
      timeout-minutes: 330
      env:
        BATCH_NUMBER: ${{ matrix.batch }}
        
    - name: Monitor disk space
      if: always()
      run: |
        echo "Final disk space:"
        df -h
        echo "Reports directory size:"
        du -sh reports/ || echo "No reports directory"
      
    - name: Check for changes
      id: check_changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Only add new/modified files, not already tracked files
        git add -A reports/
        
        # Check if there are actually changes to commit
        if git diff --cached --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No new files to commit"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Found new files to commit"
        fi
        
    - name: Commit and push changes (Batch ${{ matrix.batch }})
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        # Commit first
        git commit -m "Update financial reports - Batch ${{ matrix.batch }} - $(date +'%Y-%m-%d')"
        
        # Pull and handle scrape_summary.json conflicts
        MAX_RETRIES=5
        RETRY_COUNT=0
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          git pull --rebase origin main || git pull --rebase origin master
          
          # If there's a conflict in scrape_summary.json, take theirs and append ours
          if [ -f "reports/scrape_summary.json" ] && git diff --name-only --diff-filter=U | grep -q "reports/scrape_summary.json"; then
            echo "Resolving scrape_summary.json conflict..."
            git checkout --theirs reports/scrape_summary.json
            git add reports/scrape_summary.json
            git rebase --continue
          fi
      
          # Try to push
          if git push; then
            echo "Successfully pushed changes"
            break
          fi
          
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "Push failed, retry $RETRY_COUNT/$MAX_RETRIES..."
          sleep $((RETRY_COUNT * 10))
        done
    
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
        fi
        
    - name: Create summary
      if: always()
      run: |
        echo "## Scraping Summary - Batch ${{ matrix.batch }}" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "reports" ]; then
          echo "**Tickers processed:** $(find reports -mindepth 1 -maxdepth 1 -type d | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total PDFs:** $(find reports -name "*.pdf" | wc -l)" >> $GITHUB_STEP_SUMMARY
          TOTAL_SIZE=$(du -sh reports/ 2>/dev/null | cut -f1)
          echo "**Total size:** $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nse-reports-batch-${{ matrix.batch }}-${{ github.run_number }}
        path: reports/
        retention-days: 90
        
    - name: Cleanup before next batch
      if: always()
      run: |
        rm -rf reports/
        echo "Cleaned up reports directory"
