name: NSE Financial Reports Scraper

on:
  # Run mid-quarter: Feb 15, May 15, Aug 15, Nov 15 at 2 AM UTC
  schedule:
    - cron: '0 2 15 2,5,8,11 *'
  
  # Allow manual trigger
  workflow_dispatch:
permissions:
  contents: write


  
jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Tor
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y tor
        sudo service tor start
        sleep 5
        echo "✓ Tor service started"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install urllib3[socks]
    
    - name: Verify Tor connection
      run: |
        TOR_IP=$(curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -o '"IP":"[^"]*"' | cut -d'"' -f4)
        echo "✓ Connected through Tor exit node: $TOR_IP"
        
    - name: Create reports directory
      run: mkdir -p reports
      
    - name: Run scraper
      run: |
        python scraper.py
      continue-on-error: true
      timeout-minutes: 360
      
    - name: Check for changes
      id: check_changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add reports/
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git commit -m "Update financial reports - $(date +'%Y-%m-%d')"
        git push
        
    - name: Create summary
      if: always()
      run: |
        echo "## Scraping Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "reports" ]; then
          echo "**Tickers processed:** $(find reports -mindepth 1 -maxdepth 1 -type d | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total PDFs:** $(find reports -name "*.pdf" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New files added:" >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD~1 HEAD 2>/dev/null | grep "\.pdf$" || echo "No new files" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nse-reports-${{ github.run_number }}
        path: reports/
        retention-days: 90
